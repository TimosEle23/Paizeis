name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Typecheck, boundaries and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Client and server boundary
        run: npm run check:boundaries

      # Each suite starts a real MongoDB replica set through
      # mongodb-memory-server. Booking creation depends on a transaction, which
      # a standalone mongod cannot run, so tests against one would pass while
      # production behaved differently.
      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
